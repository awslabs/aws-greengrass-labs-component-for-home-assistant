# Run pipelines for merge requests and the default branch only
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - Static Analysis
  - Unit Tests
  - Security Scan
  - CDK

.python:
  image: python:3.13
  before_script:
    - python --version
    - pip install -r requirements.txt
    - pylint --version
    - mypy --version
    - pytest --version
    - bandit --version

pylint:
  extends: .python
  stage: Static Analysis
  script:
  - pylint artifacts libs tests *.py

mypy:
  extends: .python
  stage: Static Analysis
  script:
  - mypy --ignore-missing-imports artifacts

pytest:
  extends: .python
  stage: Unit Tests
  script:
  - pytest --junit-xml=junit.xml --cov=artifacts --cov=.
  artifacts:
    when: always
    reports:
      junit: junit.xml

bandit:
  extends: .python
  stage: Security Scan
  script:
  - bandit -r -v artifacts libs *.py

# Type check, unit test and synthesize (includes cdk-nag) the CDK app.
# Placeholder context values are used. Synth needs no AWS credentials.
cdk:
  image: node:24
  stage: CDK
  needs: []
  variables:
    CDK_CONTEXT: >-
      -c ConnectionId=00000000-0000-0000-0000-000000000000
      -c OwnerName=placeholder
      -c GreengrassCoreName=placeholder
  cache:
    key: npm-cicd
    paths:
      - .npm/
  before_script:
    - cd cicd
    - npm ci --cache ../.npm --prefer-offline
    - node --version
    - npx cdk --version
  script:
    - npm run build
    - npm test
    - npx cdk synth --quiet --no-notices $CDK_CONTEXT
