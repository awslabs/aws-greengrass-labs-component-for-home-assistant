name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python --version
        pylint --version
        mypy --version
        pytest --version
        bandit --version
    - name: Static Analysis
      run: |
        pylint artifacts libs tests *.py
    - name: Type Checking
      run: |
        mypy --ignore-missing-imports artifacts
    - name: Unit Tests
      run: |
        pytest --junit-xml=junit.xml --cov=artifacts --cov=.
    - name: Security Scan
      run: |
        bandit -r -v artifacts libs *.py

  cdk:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cicd

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: cicd/package-lock.json
    - name: Install dependencies
      run: |
        npm ci
        node --version
        npx cdk --version
    - name: Type Checking
      run: npm run build
    - name: Unit Tests
      run: npm test
    # Placeholder context values. Synth needs no AWS credentials.
    - name: Synthesize (includes cdk-nag)
      run: >-
        npx cdk synth --quiet --no-notices
        -c ConnectionId=00000000-0000-0000-0000-000000000000
        -c OwnerName=placeholder
        -c GreengrassCoreName=placeholder
